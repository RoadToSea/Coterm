name: Windows host v1
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: pnpm build
      - run: pnpm plugin:ssh:build
      - run: pnpm plugin:serial:build
      - run: pnpm test
      - run: cargo build -p coterm-runtime-fixture --locked
      - run: pnpm tauri:build --config ../../tests/fixtures/tauri-smoke.conf.json --bundles nsis
      - name: Install and exercise real Tauri
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - run: pnpm tauri:build --bundles nsis
      - name: Verify production installer
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Production
      - name: Build distributable SSH plugin
        run: |
          pnpm plugin:ssh:build --release
          pnpm plugin:pack plugins/plugin-ssh/dist target/release/bundle/plugins/coterm-plugin-ssh-windows-x64.coterm
      - uses: actions/upload-artifact@v4
        with:
          name: coterm-windows-x64
          path: |
            target/release/bundle/nsis/Coterm_*_x64-setup.exe
            target/release/bundle/plugins/*.coterm
          if-no-files-found: error
      - name: Publish tagged Windows installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/Coterm_*_x64-setup.exe
            target/release/bundle/plugins/*.coterm
    permissions:
      contents: write
